name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify portable agent synchronization
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "agent-sync-validation"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          python skills/multi-agent-sync/scripts/install.py $project --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtures = @{
            ".agents/skills/fixture/SKILL.md" = "# Fixture skill`n"
            ".codex/rules/shared.md" = "# Shared rule`n"
            ".codex/hooks/read_learnings.py" = "print('hook-ok')`n"
            ".codex/scripts/shared.py" = "print('script-ok')`n"
            ".codex/workflows/fixture/workflow.md" = "# Fixture workflow`n"
            "AGENTS.md" = "# Shared instructions`n"
          }
          foreach ($fixture in $fixtures.GetEnumerator()) {
            $path = Join-Path $project $fixture.Key
            New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
            [System.IO.File]::WriteAllText($path, $fixture.Value)
          }
          $sync = Join-Path $project ".agent-sync/sync_agents.py"
          $bootstrap = Join-Path $project ".agent-sync/bootstrap.py"
          $validator = Join-Path $project ".agent-sync/validate_portability.py"
          python $sync --root $project --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $sync --root $project --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $bootstrap --root $project --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $bootstrap --root $project --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targetPlatform = "${{ runner.os }}".ToLowerInvariant()
          python $validator --root . --platform $targetPlatform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install validation dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install validation dependency (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install validation dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep --no-progress -y
      - name: Run project validation
        shell: bash
        run: bash scripts/validate.sh
      - name: Audit project for secrets and insecure patterns
        shell: bash
        run: bash skills/security-secret-audit/scripts/audit-secrets.sh --project --strict
